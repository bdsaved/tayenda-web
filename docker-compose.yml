services:
  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: tayenda
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tayenda"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - uploads_data:/app/storage
    expose:
      - "8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://user:${POSTGRES_PASSWORD:-password}@db/tayenda
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in web/.env (see .env.example)}
      STORAGE_PATH: /app/storage
      WEB_CLIENT_ORIGIN: https://${PUBLIC_DOMAIN:-tayenda.renai-labs.com}
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-admin}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?Set OPERATOR_PASSWORD in web/.env (see .env.example)}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-admin@tayenda.local}
      PUBLIC_WEB_ORIGIN: https://${PUBLIC_DOMAIN:-tayenda.renai-labs.com}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-30}
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        # Empty = same origin; Caddy routes /api/* to the server.
        VITE_API_URL: ""
        # Optional: Mapbox base map instead of OpenStreetMap (see client/.env.example).
        VITE_MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
        VITE_MAPBOX_STYLE: ${MAPBOX_STYLE:-}
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - server

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${NPM_UPSTREAM_PORT:-3001}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - client
      - server

volumes:
  uploads_data:
