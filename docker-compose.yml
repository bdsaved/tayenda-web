version: '3.8'

services:
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: tayenda
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  server:
    build: ./server
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./server:/app
      - uploads_data:/app/storage
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db/tayenda
      SECRET_KEY: supersecretkey
      STORAGE_PATH: /app/storage
    depends_on:
      - db

  client:
    build: ./client
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: https://strongbox-emphases-uptown.ngrok-free.dev
      VITE_PUBLIC_WEB_URL: https://tayenda.renai-labs.com
      VITE_NGROK_URL: https://strongbox-emphases-uptown.ngrok-free.dev
    depends_on:
      - server

volumes:
  postgres_data:
  uploads_data:
