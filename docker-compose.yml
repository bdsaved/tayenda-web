services:
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: tayenda
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  server:
    build: ./server
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./server:/app
      - uploads_data:/app/storage
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db/tayenda
      SECRET_KEY: supersecretkey
      STORAGE_PATH: /app/storage
      OPERATOR_USERNAME: admin
      OPERATOR_PASSWORD: tayenda-admin
      OPERATOR_EMAIL: brenalddzonzi@gmail.com
      PUBLIC_WEB_ORIGIN: https://tayenda.renai-labs.com
    depends_on:
      - db

  client:
    build: ./client
    ports:
      - "3001:3000"
    environment:
      VITE_API_URL: https://api.tayenda.renai-labs.com
      VITE_PUBLIC_WEB_URL: https://tayenda.renai-labs.com
    depends_on:
      - server

volumes:
  postgres_data:
  uploads_data:
